name: Release Bundle

# Tag-triggered only (and manual). Never runs on pull_request, so fork PRs can
# never reach the signing secrets. Cut a release with: git tag v1.0.0 && git push --tags
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

    - name: set up JDK 17
      uses: actions/setup-java@ad2b38190b15e4d6bdf0c97fb4fca8412226d287 # v5.3.0
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Decode upload keystore
      if: ${{ env.KEYSTORE_BASE64 != '' }}
      run: |
        echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
        echo "KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

    - name: Warn if signing secrets are missing
      if: ${{ env.KEYSTORE_BASE64 == '' }}
      run: echo "::warning::No KEYSTORE_BASE64 secret set - the bundle will be UNSIGNED and is not uploadable to Play. See docs/RELEASE.md."

    - name: Build release bundle
      run: ./gradlew bundleRelease

    - name: Upload AAB
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: app-release-aab
        path: app/build/outputs/bundle/release/app-release.aab
        if-no-files-found: error

    - name: Upload R8 mapping
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: mapping
        path: app/build/outputs/mapping/release/mapping.txt
        if-no-files-found: warn
