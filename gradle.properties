# Project-wide Gradle settings.
# Run the build with more heap and parallel/caching enabled.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# Kotlin code style for this project: "official" or "obsolete".
kotlin.code.style=official

# AndroidX package structure to make clear which packages are bundled with the
# Android operating system, and which are packaged with your app's APK.
android.useAndroidX=true

# Generate per-module R classes (non-transitive) to reduce R class size.
android.nonTransitiveRClass=true

# App version. Bump VERSION_CODE on every Play upload (must be unique and
# monotonically increasing); VERSION_NAME is the human-facing string.
VERSION_CODE=1
VERSION_NAME=1.0
